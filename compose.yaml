# Sobe o dashboard inteiro com `docker compose up --build`:
# web em http://localhost:3000 e o WebSocket em ws://localhost:4000/metrics.
services:
  server:
    build:
      context: .
      target: server
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      TICK_MS: "1000"
    ports:
      - "4000:4000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:4000/metrics
    ports:
      - "3000:3000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
